name: Trigger Jenkins

on:
  push:
    branches:
      - develop
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-jenkins:
    name: Notify Jenkins Webhook
    runs-on: ubuntu-latest
    steps:
      - name: Send push event to Jenkins
        env:
          JENKINS_WEBHOOK_URL: ${{ secrets.JENKINS_WEBHOOK_URL }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [[ -z "${JENKINS_WEBHOOK_URL:-}" ]]; then
            echo "Falta el secret JENKINS_WEBHOOK_URL"
            exit 1
          fi

          payload=$(jq -n \
            --arg ref "$GITHUB_REF" \
            --arg after "$GITHUB_SHA" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg event "$GITHUB_EVENT_NAME" \
            '{
              ref: $ref,
              after: $after,
              repository: { full_name: $repo },
              hook: { type: "Workflow" },
              event_name: $event
            }')

          curl -fsS -X POST "$JENKINS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-GitHub-Delivery: $GITHUB_SHA" \
            -d "$payload"

          echo "Webhook enviado a Jenkins para rama: $GITHUB_REF_NAME"
